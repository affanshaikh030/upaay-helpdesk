<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upaay</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash of light mode
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
      // Same for the "Desktop site" choice: it only swaps the content of the viewport tag above
      try {
        if (localStorage.getItem('viewport') === 'desktop')
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1280')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
