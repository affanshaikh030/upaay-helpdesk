<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upaay</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme. Dark is the default
      // for new visitors (the OS setting is ignored); only a saved 'light' choice turns it off
      var dark = true
      try {
        dark = localStorage.getItem('theme') !== 'light'
      } catch (e) {}
      if (dark) document.documentElement.classList.add('dark')
      // Same for the "Desktop site" choice: it only swaps the content of the viewport tag above
      try {
        if (localStorage.getItem('viewport') === 'desktop')
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1280')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
